name: Проверка White Glove

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Проверить статическую страницу
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s instagram/maria.jpg
          test -s instagram/commercial.jpg
          node --check app.js
