name: Сборка сайта MONTAL

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: montal-build
  cancel-in-progress: true

jobs:
  build-and-sync:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[compiled site]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить исходную HTML-страницу
        run: cp src/index.template.html index.html

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Собрать сайт
        run: npm run build

      - name: Синхронизировать готовые файлы для GitHub Pages
        run: |
          rm -rf assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          cp dist/index.html index.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets

          if git diff --cached --quiet; then
            echo "Готовая версия уже синхронизирована."
            exit 0
          fi

          git commit -m "Update compiled MONTAL site [compiled site]"
          git push origin HEAD:main
