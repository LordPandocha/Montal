<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <meta name="robots" content="noindex, nofollow">
  <title>Сайт временно недоступен</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #08090b;
      color: #f2f2f0;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 28px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(81, 84, 91, .17), transparent 48%),
        linear-gradient(145deg, #101114 0%, #08090b 52%, #0c0d10 100%);
    }
    .glow {
      position: fixed;
      width: min(68vw, 720px);
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      border: 1px solid rgba(255,255,255,.045);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 100px rgba(255,255,255,.018), inset 0 0 100px rgba(255,255,255,.012);
      pointer-events: none;
    }
    .glow::before, .glow::after {
      content: "";
      position: absolute;
      inset: 9%;
      border: 1px solid rgba(255,255,255,.035);
      border-radius: 50%;
    }
    .glow::after { inset: 20%; }
    main {
      position: relative;
      z-index: 1;
      width: min(100%, 680px);
      text-align: center;
      animation: appear .9s ease-out both;
    }
    .mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 44px;
      color: #a8a9ae;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    .mark::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c5c6cb;
      box-shadow: 0 0 14px rgba(220,220,225,.42);
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 62px);
      line-height: 1.08;
      letter-spacing: -.055em;
      font-weight: 500;
    }
    p {
      max-width: 420px;
      margin: 22px auto 0;
      color: #898b92;
      font-size: clamp(14px, 2vw, 16px);
      line-height: 1.8;
      font-weight: 400;
    }
    .rule {
      width: 42px;
      height: 1px;
      margin: 34px auto 0;
      background: linear-gradient(90deg, transparent, #777980, transparent);
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      body { padding: 22px; }
      .glow { width: 120vw; }
      .mark { margin-bottom: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <div class="mark">MONTAL</div>
    <h1>Сайт временно<br>недоступен</h1>
    <p>Мы временно приостановили работу сайта.<br>Пожалуйста, загляните сюда позже.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
