name: Сборка и публикация MONTAL

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Собрать сайт
        run: npm run build

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Передать собранный сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4